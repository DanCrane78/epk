<!doctype html><meta charset="utf-8">
<!-- Instagram images for the free-song giveaway, on brick.
     Rendered by: node tools/make-giveaway-images.js
     ?format=post (1080x1350, 4:5 feed post) or ?format=story (1080x1920)
     The post keeps everything inside the middle 3:4 so the profile grid crop
     never cuts or crowds anything. -->
<style>
  @font-face { font-family: "Jost"; font-weight: 400 500; src: url("../assets/fonts/jost-latin.woff2") format("woff2"); }
  :root { --paper: #e8e2d8; --ink: #231a15; --brick: #8a5240; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--brick); color: var(--paper); font-family: "Jost", sans-serif; }
  .c { width: 1080px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .logo { width: 170px; display: block; }
  .cover { display: block; aspect-ratio: 1; object-fit: cover; box-shadow: 0 24px 60px rgba(35,26,21,.35); }
  .kicker { font-weight: 500; font-size: 24px; letter-spacing: .16em; text-transform: uppercase; margin: 0; opacity: .8; }
  h1 { font-weight: 500; line-height: 1; letter-spacing: -.02em; margin: 0; }
  .sub { font-size: 34px; line-height: 1.3; margin: 0; }
  .from { font-size: 24px; margin: 0; opacity: .8; }
  .tag { display: inline-block; background: var(--paper); color: var(--ink); font-weight: 500; font-size: 30px; padding: 18px 34px; }

  .post { height: 1350px; padding: 96px 150px; justify-content: space-between; }
  .post .cover { width: 470px; }
  .post h1 { font-size: 88px; }
  .post .stack { display: flex; flex-direction: column; align-items: center; gap: 22px; }

  /* story: top and bottom 250px kept clear for Instagram's own buttons */
  .story { height: 1920px; padding: 250px 110px; justify-content: space-between; }
  .story .logo { width: 200px; }
  .story .cover { width: 600px; }
  .story h1 { font-size: 104px; }
  .story .stack { display: flex; flex-direction: column; align-items: center; gap: 26px; }
</style>
<body>
<div id="root"></div>
<script>
  var story = new URLSearchParams(location.search).get("format") === "story";
  var html =
    '<img class="logo" src="../assets/brand/logo-light.svg" alt="">' +
    '<img class="cover" src="../assets/releases/music-to-sit-down-to.jpg" alt="">' +
    '<div class="stack"><p class="kicker">unreleased · free</p>' +
    '<h1>a song nobody’s<br>heard yet.</h1>' +
    '<p class="sub">Free to the first 250 people who sign up.</p>' +
    '<p class="from">from the Music To Sit Down To sessions</p></div>' +
    '<span class="tag">link in bio →</span>';
  document.getElementById("root").innerHTML = '<div class="c ' + (story ? 'story' : 'post') + '">' + html + '</div>';
</script>
</body>
